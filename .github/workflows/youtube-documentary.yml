name: YouTube Documentary Pack

on:
  workflow_dispatch:
    inputs:
      language:
        description: Output language
        required: true
        type: choice
        options: [Hindi, English]
      topic:
        description: Episode topic
        required: true
        default: Everyday life in Ancient Rome
        type: string
      angle:
        description: Specific story angle
        required: true
        default: How ordinary Romans lived, ate, worked and slept
        type: string
      model:
        description: FreeLLMAPI model ID or router alias
        required: true
        default: auto
        type: string

permissions:
  contents: read

jobs:
  build-pack:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check FreeLLMAPI connection
        env:
          BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" && test -n "$API_KEY"
          case "$BASE_URL" in https://*) ;; *) echo "::error::HTTPS URL required"; exit 1;; esac
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $API_KEY" "${BASE_URL%/}/v1/models" >/dev/null
      - name: Install Hermes
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup
      - name: Configure Hermes
        env:
          BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: npx --yes freellmapi setup-hermes --url "$BASE_URL" --api-key "$API_KEY" --model "$MODEL"
      - name: Generate documentary pack
        env:
          LANGUAGE: ${{ inputs.language }}
          TOPIC: ${{ inputs.topic }}
          ANGLE: ${{ inputs.angle }}
        run: |
          set -euo pipefail
          mkdir -p projects/youtube/output
          TASK="Read agents/hermes/AGENT.md, projects/youtube/README.md and projects/youtube/prompts/episode-pack.md. Produce a complete original 10–15 minute documentary pack in $LANGUAGE. Topic: $TOPIC. Angle: $ANGLE. Save it as projects/youtube/output/episode-pack.md. Never invent citations; mark unverifiable claims VERIFY BEFORE RECORDING."
          hermes -z "$TASK"
      - name: Validate pack
        run: python3 scripts/validate_pack.py projects/youtube/output/episode-pack.md
      - name: Upload pack
        uses: actions/upload-artifact@v4
        with:
          name: youtube-production-pack
          path: projects/youtube/output/episode-pack.md
          if-no-files-found: error
