name: Hermes Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the shared Hermes agent
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check required secrets
        env:
          BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" && test -n "$API_KEY" && test -n "$MODEL"
          case "$BASE_URL" in https://*) ;; *) echo "::error::HTTPS endpoint required"; exit 1;; esac
      - name: Install Hermes
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup
      - name: Configure gateway
        env:
          BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          MODEL: ${{ secrets.FREELLMAPI_MODEL }}
        run: npx --yes freellmapi setup-hermes --url "$BASE_URL" --api-key "$API_KEY" --model "$MODEL"
      - name: Run task
        env:
          TASK: ${{ inputs.task }}
        run: hermes -z "$TASK"
