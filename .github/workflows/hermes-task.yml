name: Hermes Task

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the shared Hermes agent
        required: true
        type: string
      model:
        description: FreeLLMAPI model ID or router alias
        required: true
        default: auto
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check FreeLLMAPI connection
        env:
          BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$BASE_URL" && test -n "$API_KEY"
          case "$BASE_URL" in https://*) ;; *) echo "::error::HTTPS URL required"; exit 1;; esac
          curl --fail-with-body --silent --show-error -H "Authorization: Bearer $API_KEY" "${BASE_URL%/}/v1/models" >/dev/null
      - name: Install Hermes
        run: curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --skip-setup
      - name: Configure Hermes with FreeLLMAPI
        env:
          BASE_URL: ${{ secrets.FREELLMAPI_BASE_URL }}
          API_KEY: ${{ secrets.FREELLMAPI_API_KEY }}
          MODEL: ${{ inputs.model }}
        run: npx --yes freellmapi setup-hermes --url "$BASE_URL" --api-key "$API_KEY" --model "$MODEL"
      - name: Run task
        env:
          TASK: ${{ inputs.task }}
        run: hermes -z "$TASK"
